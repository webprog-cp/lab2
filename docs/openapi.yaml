servers:
  - url: //localhost:8080/api/v1
components:
  requestBodies:
    dto.CatRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/dto.CatRequest"
      description: Cat
      required: true
    dto.ShelterRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/dto.ShelterRequest"
      description: Shelter
      required: true
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
  schemas:
    dto.CatRequest:
      properties:
        adopted:
          type: boolean
        ageMonths:
          maximum: 360
          type: integer
        gender:
          enum:
            - male
            - female
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        shelterID:
          minimum: 1
          type: integer
      required:
        - ageMonths
        - gender
        - name
        - shelterID
      type: object
    dto.CatResponse:
      properties:
        adopted:
          type: boolean
        ageMonths:
          type: integer
        gender:
          type: string
        id:
          type: integer
        name:
          type: string
        shelterID:
          type: integer
      type: object
    dto.ErrorResponse:
      properties:
        error:
          type: string
      type: object
    dto.ShelterRequest:
      properties:
        address:
          maxLength: 200
          minLength: 1
          type: string
        capacity:
          minimum: 1
          type: integer
        city:
          maxLength: 100
          minLength: 1
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - address
        - capacity
        - city
        - name
      type: object
    dto.ShelterResponse:
      properties:
        address:
          type: string
        capacity:
          type: integer
        city:
          type: string
        id:
          type: integer
        name:
          type: string
      type: object
